name: Sync Upstream

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write  # 显式声明写入代码与 Tags 的权限

jobs:
  sync_latest_from_upstream:
    runs-on: ubuntu-latest
    name: Sync latest commits from upstream repo

    steps:
    - name: Checkout target repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Sync upstream branch and tags
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        
        # 添加上游仓库并拉取所有分支及标签
        git remote add upstream https://github.com/maillab/cloud-mail.git || true
        git fetch upstream --tags

        # 合并上游 main 分支并推送代码
        git checkout main
        git merge upstream/main --ff-only || git merge upstream/main -m "Merge upstream changes"
        git push origin main

        # 推送同步过来的 Tags
        git push origin --tags

name: Sync Upstream

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    runs-on: ubuntu-latest
    name: Sync latest commits and tags from upstream

    steps:
    - name: Checkout target repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.SYNC_TOKEN }}

    - name: Sync upstream branch and tags
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        git remote add upstream https://github.com/maillab/cloud-mail.git || true
        git fetch upstream --tags
        git fetch upstream main

        git checkout main
        git merge upstream/main --allow-unrelated-histories -X theirs -m "chore: sync upstream changes"

        git push origin main
        git push origin --tags

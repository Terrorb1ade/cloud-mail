name: Sync Upstream

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync_latest_from_upstream:
    runs-on: ubuntu-latest
    name: Sync latest commits and tags from upstream

    steps:
    - name: Checkout target repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Sync upstream branch and tags
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        # 添加上游源并拉取
        git remote add upstream https://github.com/maillab/cloud-mail.git || true
        git fetch upstream --tags
        git fetch upstream main

        # 允许合并独立历史并生成 merge commit
        git checkout main
        git merge upstream/main --allow-unrelated-histories -m "chore: sync upstream changes"

        # 推送分支代码与 Tags
        git push origin main
        git push origin --tags
